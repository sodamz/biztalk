<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizTalk AI — 업무 말투 변환기</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="background-decor">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-badge">
        <span class="badge-icon">⚡</span>
        <span class="badge-text">Powered by Solar-Pro3</span>
      </div>
      <h1 class="app-title">BizTalk <span class="gradient-text">AI</span></h1>
      <p class="app-subtitle">생각나는 대로 적으세요. 상황에 완벽한 비즈니스 어조로 자동 변환해 드립니다.</p>
    </header>

    <!-- Quick Example Chips -->
    <section class="quick-chips-section">
      <span class="quick-label">💡 자주 쓰는 문장 퀵 입력:</span>
      <div class="chips-group">
        <button type="button" class="chip-btn" data-text="내일까지 보고서 제출 어려울 것 같음">내일 보고서 제출 연기</button>
        <button type="button" class="chip-btn" data-text="이 기능 언제까지 완료 가능한지 알려주세요">개발 일정 확인 요청</button>
        <button type="button" class="chip-btn" data-text="다음 주 회의 일정 변경할 수 있을까요?">회의 일정 변경</button>
        <button type="button" class="chip-btn" data-text="다음 주 월요일 연차 사용 신청합니다">연차 사용 신청</button>
      </div>
    </section>

    <!-- Main Converter Form -->
    <main class="converter-card">
      <!-- Target Audience Selection -->
      <div class="target-selection">
        <label class="section-label">1. 수신 대상 선택</label>
        <div class="target-buttons-grid">
          <button type="button" class="target-btn active" data-target="boss">
            <span class="target-icon">👔</span>
            <div class="target-info">
              <span class="target-name">상사 / 임원</span>
              <span class="target-desc">격식 있고 공손한 어조</span>
            </div>
          </button>
          
          <button type="button" class="target-btn" data-target="colleague">
            <span class="target-icon">🤝</span>
            <div class="target-info">
              <span class="target-name">타팀 동료</span>
              <span class="target-desc">정중하고 협조적인 어조</span>
            </div>
          </button>

          <button type="button" class="target-btn" data-target="client">
            <span class="target-icon">💼</span>
            <div class="target-info">
              <span class="target-name">고객 / 외부</span>
              <span class="target-desc">친절하고 신뢰감 있는 어조</span>
            </div>
          </button>

          <button type="button" class="target-btn" data-target="team">
            <span class="target-icon">💬</span>
            <div class="target-info">
              <span class="target-name">팀 내 동료</span>
              <span class="target-desc">간결하고 실무적인 어조</span>
            </div>
          </button>
        </div>
      </div>

      <!-- Dual Pane Text Areas -->
      <div class="editor-dual-pane">
        <!-- Original Input Pane -->
        <div class="pane pane-input">
          <div class="pane-header">
            <label for="inputText" class="pane-title">✏️ 작성할 내용 (원문)</label>
            <span class="char-count" id="charCount">0 / 1000자</span>
          </div>
          <div class="textarea-wrapper">
            <textarea
              id="inputText"
              placeholder="예: 내일까지 보고서 제출 어려울 것 같음. 일정 조율 가능한가요?"
              maxlength="1000"
            ></textarea>
            <button type="button" class="clear-btn" id="clearBtn" title="내용 지우기">&times;</button>
          </div>
        </div>

        <!-- Converted Output Pane -->
        <div class="pane pane-output">
          <div class="pane-header">
            <span class="pane-title">✨ AI 변환 결과</span>
            <button type="button" class="copy-btn" id="copyBtn" disabled>
              <span class="copy-icon">📋</span>
              <span class="copy-text">결과 복사</span>
            </button>
          </div>
          <div class="textarea-wrapper output-wrapper">
            <textarea
              id="outputText"
              placeholder="수신 대상을 선택하고 [변환하기] 버튼을 누르면 정제된 업무 메세지가 여기에 표시됩니다."
              readonly
            ></textarea>
            <!-- Loading Visualizer Overlay -->
            <div class="loading-overlay" id="loadingOverlay">
              <div class="spinner"></div>
              <p class="loading-text">Solar-Pro3가 비즈니스 어조로 정제 중...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Button Area -->
      <div class="action-bar">
        <div class="shortcut-tip">💡 팁: <kbd>Ctrl</kbd> + <kbd>Enter</kbd> 누르면 바로 변환됩니다.</div>
        <button type="button" class="convert-btn" id="convertBtn">
          <span class="btn-sparkle">✨</span>
          <span class="btn-text">업무 말투로 변환하기</span>
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>© 2026 BizTalk AI — One Day Project Powered by Upstage & FastAPI</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="./js/app.js"></script>
</body>
</html>
